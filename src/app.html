<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%232563eb' stroke-width='4'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Helvetica,sans-serif' font-weight='bold' font-size='28' fill='%232563eb'%3ET%3C/text%3E%3C/svg%3E"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Apply PNG stamps and signatures to PDF documents in the browser." />
		<title>timbrapp — PDF stamping</title>
		%sveltekit.head%
		<script>
			// Surface boot failures instead of a silent white window.
			window.addEventListener('error', function (e) {
				if (document.getElementById('timbrapp-boot-error')) return;
				var el = document.createElement('pre');
				el.id = 'timbrapp-boot-error';
				el.style.cssText =
					'position:fixed;inset:12px;z-index:99999;margin:0;padding:16px;overflow:auto;background:#1e1e1e;color:#f87171;font:13px/1.4 ui-monospace,monospace;white-space:pre-wrap;border-radius:8px;';
				el.textContent =
					'timbrapp failed to start:\n\n' +
					(e.message || String(e.error || e)) +
					(e.filename ? '\n\n' + e.filename + ':' + e.lineno : '');
				document.documentElement.appendChild(el);
			});
			window.addEventListener('unhandledrejection', function (e) {
				if (document.getElementById('timbrapp-boot-error')) return;
				var el = document.createElement('pre');
				el.id = 'timbrapp-boot-error';
				el.style.cssText =
					'position:fixed;inset:12px;z-index:99999;margin:0;padding:16px;overflow:auto;background:#1e1e1e;color:#f87171;font:13px/1.4 ui-monospace,monospace;white-space:pre-wrap;border-radius:8px;';
				el.textContent = 'timbrapp failed to start:\n\n' + String(e.reason);
				document.documentElement.appendChild(el);
			});
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
