name: Release

# Build and publish desktop installers for macOS, Linux and Windows when a
# version tag (e.g. `v0.1.0`) is pushed. Can also be triggered manually.
#
# Topology:
#   create-release  →  build (matrix x4)  →  publish-release
#
# `create-release` runs first and produces a single draft release whose ID
# is passed to every matrix build. Without this, all 4 matrix jobs race to
# create their own draft when none exists yet, which silently produces 4
# duplicate drafts (each with only one platform's assets and a partial
# `latest.json`). Tying the matrix to a pre-created `release_id` removes
# the race.
#
# `publish-release` flips the draft to published + Latest after every
# matrix build succeeds, so users never see a half-uploaded release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `timbrapp ${tag}`,
              body: 'See `CHANGELOG.md` for details. Installers below are built from this tag.',
              draft: true,
              prerelease: false,
            });
            core.setOutput('release_id', data.id);
            core.notice(`Created draft release ${tag} (id=${data.id})`);

  build:
    name: Build (${{ matrix.platform.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Apple Silicon)
            os: macos-latest
            rust-target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: macOS (Intel)
            os: macos-latest
            rust-target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - name: Linux (x86_64)
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            args: ''
          - name: Windows (x86_64)
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-target }}

      - name: Cache Cargo registry + target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # Force a complete Rust recompile so the new SvelteKit frontend bundle
      # (with the tauri-plugin-dialog fix) is actually embedded in the binary.
      # Without this, swatinem/rust-cache can restore pre-compiled objects that
      # still have the old frontend embedded via include_dir!/build.rs macros.
      - name: Clean Rust build artifacts
        run: cargo clean --manifest-path src-tauri/Cargo.toml

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization. tauri-action looks for these
          # exact names; when they're empty the macOS jobs simply skip
          # signing and produce an unsigned .dmg (current behaviour). When
          # all of them are populated, the .app inside the .dmg is signed
          # with the Developer ID and submitted to Apple's notary service
          # automatically — no workflow changes needed.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # Tauri updater signing — the Ed25519 key pair generated locally
          # via `tauri signer generate`. The matching public key is embedded
          # in tauri.conf.json (plugins.updater.pubkey). With these set,
          # tauri-action signs every installer and emits a `latest.json`
          # manifest alongside the release assets, which the in-app updater
          # then trusts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # All matrix jobs upload to the SAME pre-created draft, which
          # avoids the parallel-create race that would otherwise produce
          # one draft per platform.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.platform.args }}

  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published + latest
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              make_latest: 'true',
            });
            core.notice('Release published and marked latest.');
