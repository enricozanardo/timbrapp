[package]
name = "timbrapp"
version = "0.1.9"
description = "Apply PNG stamps and signatures to PDF documents."
authors = ["timbrapp contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "timbrapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"

# rfd provides native OS file dialogs: NSOpenPanel on macOS and
# IFileOpenDialog on Windows.  It is NOT used on Linux because the GTK3
# context inside WebKitGTK conflicts with rfd's own GTK context, causing
# every dialog to render as a blank white window.  Linux uses Thunar
# drag-and-drop instead (see pick_file in lib.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.14", default-features = false }
# Auto-updater and process-restart are safe on macOS/Windows because the
# updater installs a new .dmg / .exe directly without touching the desktop
# entry.  On Linux the updater re-extracts the AppImage and overwrites the
# desktop entry, reverting to the bundled (pre-fix) binary — so it is
# intentionally excluded from Linux builds.
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
